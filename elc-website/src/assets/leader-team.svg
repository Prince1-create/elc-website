<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-hidden="true">
  <style>
    .lt-leader { transform-origin: 200px 320px; animation: ltBob 3.2s ease-in-out infinite; }
    .lt-seated { animation: ltNod 4s ease-in-out infinite; }
    .lt-badge { transform-origin: center; transform-box: fill-box; animation: ltPop 2.4s ease-in-out infinite; }
    @keyframes ltBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes ltNod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes ltPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  </style>
  <defs>
    <clipPath id="lt-blob">
      <path d="M200 30 C300 22 372 96 368 196 C364 296 300 372 196 368 C92 364 30 296 34 196 C38 96 100 38 200 30Z"/>
    </clipPath>
    <linearGradient id="lt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e0"/>
      <stop offset="1" stop-color="#d9e9e1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#lt-blob)">
    <rect width="400" height="400" fill="url(#lt-bg)"/>
    <rect x="60" y="250" width="280" height="14" rx="7" fill="#064e3b"/>
    <g class="lt-seated" fill="#0d7a5f">
      <circle cx="110" cy="200" r="24"/>
      <path d="M78 330 C78 262 92 240 110 240 C128 240 142 262 142 330Z"/>
      <circle cx="290" cy="200" r="24"/>
      <path d="M258 330 C258 262 272 240 290 240 C308 240 322 262 322 330Z"/>
    </g>
    <g class="lt-leader">
      <circle cx="200" cy="130" r="30" fill="#064e3b"/>
      <path d="M160 320 C160 240 174 196 200 196 C226 196 240 240 240 320Z" fill="#064e3b"/>
      <path d="M200 196 L200 320" stroke="#c9a84c" stroke-width="4"/>
      <path d="M232 214 L266 178" stroke="#064e3b" stroke-width="14" stroke-linecap="round"/>
    </g>
    <circle class="lt-badge" cx="268" cy="168" r="10" fill="#c9a84c"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-hidden="true">
  <style>
    .lg-bars rect { transform-origin: bottom; transform-box: fill-box; animation: lgGrow 3.6s ease-in-out infinite; }
    .lg-bars rect:nth-child(2) { animation-delay: 0.3s; }
    .lg-bars rect:nth-child(3) { animation-delay: 0.6s; }
    .lg-bars rect:nth-child(4) { animation-delay: 0.9s; }
    .lg-path { animation: lgDash 2s linear infinite; }
    .lg-flag { transform-origin: 310px 120px; animation: lgFlag 2.8s ease-in-out infinite; }
    .lg-dot { transform-origin: center; transform-box: fill-box; animation: lgDot 2.2s ease-in-out infinite; }
    @keyframes lgGrow { 0%, 100% { transform: scaleY(0.92); } 50% { transform: scaleY(1); } }
    @keyframes lgDash { to { stroke-dashoffset: -16; } }
    @keyframes lgFlag { 0%, 100% { transform: skewY(0deg); } 50% { transform: skewY(-7deg); } }
    @keyframes lgDot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
  </style>
  <defs>
    <clipPath id="lg-blob">
      <path d="M200 30 C300 22 372 96 368 196 C364 296 300 372 196 368 C92 364 30 296 34 196 C38 96 100 38 200 30Z"/>
    </clipPath>
    <linearGradient id="lg-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0d7a5f"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#lg-blob)">
    <rect width="400" height="400" fill="url(#lg-bg)"/>
    <g class="lg-bars" fill="#f5f0e0" opacity="0.14">
      <rect x="80" y="260" width="34" height="120" rx="6"/>
      <rect x="130" y="220" width="34" height="160" rx="6"/>
      <rect x="180" y="180" width="34" height="200" rx="6"/>
      <rect x="230" y="130" width="34" height="250" rx="6"/>
    </g>
    <path class="lg-path" d="M90 300 C150 290 170 220 220 200 C262 182 280 150 310 120" fill="none" stroke="#c9a84c" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 10"/>
    <g class="lg-flag">
      <line x1="310" y1="120" x2="310" y2="60" stroke="#f5f0e0" stroke-width="4" stroke-linecap="round"/>
      <path d="M312 62 L360 76 L312 92Z" fill="#c9a84c"/>
    </g>
    <circle class="lg-dot" cx="310" cy="120" r="9" fill="#f5f0e0"/>
    <rect x="150" y="300" width="100" height="36" rx="10" fill="none" stroke="#f5f0e0" stroke-width="2" opacity="0.6"/>
    <text x="200" y="324" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#f5f0e0">AI</text>
  </g>
</svg>
